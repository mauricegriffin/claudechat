[build]
  # Directory to change to before starting build
  base = "client"
  
  # Build command
  command = "npm run build"
  
  # Directory that contains the deploy-ready files
  publish = "dist"

[build.environment]
  # Node version for builds
  NODE_VERSION = "18"
  # Force npm instead of yarn
  NPM_FLAGS = "--force"
  # Tell Netlify to use npm
  NETLIFY_USE_YARN = "false"

# SPA redirect rule - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better PWA support
[[headers]]
  for = "/*"
  [headers.values]
    # Allow service worker to control all paths
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/sw.js"
  [headers.values]
    # Prevent caching of service worker
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    # Cache manifest for 1 hour
    Cache-Control = "public, max-age=3600"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), microphone=(), camera=()"