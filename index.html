<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1976d2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClaudeChat" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#1976d2" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Real-time Messaging</title>
    
    <!-- Service Worker Registration with Auto-Update -->
    <script>
      // Only register service worker in production
      const isDevelopment = window.location.hostname === 'localhost' || 
                           window.location.hostname === '127.0.0.1' ||
                           window.location.port === '5173';
      
      if ('serviceWorker' in navigator && !isDevelopment) {
        window.addEventListener('load', () => {
          let refreshing = false;
          
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered:', registration);
              
              // Check for updates every 30 seconds when online
              if (navigator.onLine) {
                setInterval(() => {
                  registration.update();
                }, 30000);
              }
              
              // Listen for new service worker waiting
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                console.log('New service worker found, installing...');
                
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New update available
                    console.log('New version available! Refreshing...');
                    
                    // Show update notification
                    if (window.showUpdateNotification) {
                      window.showUpdateNotification();
                    } else {
                      // Auto-refresh after a short delay
                      setTimeout(() => {
                        if (!refreshing) {
                          refreshing = true;
                          window.location.reload();
                        }
                      }, 2000);
                    }
                  }
                });
              });
            })
            .catch(error => console.log('SW registration failed:', error));
          
          // Handle controller change (new SW activated)
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      } else if (isDevelopment) {
        console.log('Service Worker disabled in development mode for better hot reload');
        
        // Unregister any existing service workers in development
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            registrations.forEach(registration => {
              registration.unregister();
              console.log('Unregistered existing service worker for development');
            });
          });
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
